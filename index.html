:root {
  color-scheme: dark;
  --bg: #040716;
  --bg-2: #070b22;
  --surface: rgba(10, 16, 48, 0.78);
  --surface-strong: rgba(11, 18, 55, 0.96);
  --surface-soft: rgba(255,255,255,.045);
  --text: #f8f7ff;
  --muted: #969bc4;
  --border: rgba(132, 102, 255, .22);
  --border-strong: rgba(151, 105, 255, .48);
  --primary: #9a4dff;
  --primary-2: #d94dff;
  --cyan: #20d8ff;
  --green: #24d99f;
  --yellow: #ffbd5b;
  --danger: #ff5f86;
  --shadow: 0 24px 80px rgba(0,0,0,.42);
  --radius: 24px;
  --radius-sm: 16px;
  --content: 1180px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f3ff;
  --bg-2: #ffffff;
  --surface: rgba(255,255,255,.82);
  --surface-strong: rgba(255,255,255,.98);
  --surface-soft: rgba(75, 57, 160, .055);
  --text: #11152e;
  --muted: #62688c;
  --border: rgba(93, 66, 201, .16);
  --border-strong: rgba(128, 74, 232, .38);
  --shadow: 0 24px 70px rgba(50,45,100,.14);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  font-family: "Dana", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 12% 8%, rgba(118, 52, 255, .18), transparent 32rem),
    radial-gradient(circle at 88% 19%, rgba(0, 171, 255, .13), transparent 28rem),
    radial-gradient(circle at 50% 86%, rgba(218, 53, 255, .10), transparent 32rem),
    linear-gradient(180deg, var(--bg-2), var(--bg));
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .22;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, black, transparent 75%);
}
button, input, select, a { font: inherit; }
button, select { color: inherit; }
a { color: inherit; text-decoration: none; }
button { border: 0; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid rgba(60, 214, 255, .42);
  outline-offset: 2px;
}
svg { display: block; }
.hidden { display: none !important; }
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
.app-shell { width: min(calc(100% - 28px), var(--content)); margin: 0 auto; padding: 20px 0 112px; position: relative; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom: 18px; }
.user-welcome { display:flex; align-items:center; gap:12px; min-width:0; }
.avatar {
  width:54px; height:54px; border-radius:50%; padding:2px; flex:0 0 auto;
  background: conic-gradient(from 140deg, var(--cyan), var(--primary), var(--primary-2), var(--cyan));
  box-shadow: 0 0 26px rgba(94, 97, 255, .35);
}
.avatar-inner { width:100%; height:100%; border-radius:50%; display:grid; place-items:center; background:#111936; color:white; overflow:hidden; font-weight:900; font-size:20px; }
.avatar img { width:100%;height:100%;object-fit:cover; }
.online-dot { width:12px;height:12px;border-radius:50%;background:#23da74;border:2px solid var(--bg); position:absolute; inset-inline-end:0; bottom:1px; }
.avatar-wrap { position:relative; }
.hello { font-size:16px; font-weight:850; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.subtitle { color:var(--muted); font-size:13px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.toolbar { display:flex; align-items:center; gap:8px; }
.icon-btn, .lang-btn {
  height:46px; min-width:46px; border:1px solid var(--border); border-radius:15px; background:var(--surface);
  display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
  backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  transition:.22s ease;
}
.lang-btn { padding:0 12px; font-weight:800; }
.icon-btn:hover, .lang-btn:hover { transform:translateY(-2px); border-color:var(--border-strong); box-shadow:0 10px 28px rgba(101,60,255,.14); }
.card {
  position:relative; overflow:hidden; border:1px solid var(--border); border-radius:var(--radius);
  background:linear-gradient(145deg, rgba(255,255,255,.055), transparent 38%), var(--surface);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), var(--shadow);
  backdrop-filter: blur(22px);
}
.card::after { content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 50px rgba(71,71,255,.035); }
.hero { min-height:290px; padding:24px; display:grid; grid-template-columns: 1.35fr .65fr; gap:18px; align-items:center; }
.hero::before {
  content:""; position:absolute; width:420px;height:420px; border-radius:50%; inset-inline-start:-95px; top:-95px;
  background:radial-gradient(circle, rgba(79,44,255,.18), rgba(17,23,62,.02) 58%, transparent 72%);
  border:1px solid rgba(125,97,255,.12); opacity:.8;
}
.hero-map { position:absolute; inset:10px 37% 10px 0; opacity:.16; pointer-events:none; }
[dir="rtl"] .hero-map { inset:10px 0 10px 37%; }
.map-dots { width:100%;height:100%; background-image:radial-gradient(circle, rgba(142,126,255,.9) 1.1px, transparent 1.2px); background-size:8px 8px; mask-image:radial-gradient(ellipse 70% 55% at 50% 50%, #000 20%, transparent 72%); }
.hero-content { position:relative; z-index:2; }
.status-line { display:flex;align-items:center;gap:9px;font-weight:800;margin-bottom:18px; }
.status-check { width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#06191a;background:var(--green);box-shadow:0 0 18px rgba(36,217,159,.42); }
.plan-title { display:flex;align-items:baseline;gap:8px;flex-wrap:wrap; margin:0 0 8px; }
.plan-title strong { font-size:44px;line-height:1;font-weight:950;letter-spacing:-.04em; }
.plan-title span { font-size:28px;font-weight:900;color:var(--primary-2); }
.remaining-caption { color:var(--primary-2);font-size:13px;font-weight:800;margin:-1px 0 9px; }
.expiry { color:var(--muted); font-size:14px; }
.hero-meta { margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; }
.pill { display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:var(--surface-soft);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:750; }
.progress-wrap { display:grid; place-items:center; position:relative; z-index:2; }
.progress-ring { --p:0; width:180px;height:180px;border-radius:50%;display:grid;place-items:center; position:relative;
  background:conic-gradient(from 215deg, var(--cyan) 0%, var(--primary) calc(var(--p)*1%), rgba(255,255,255,.08) 0);
  box-shadow:0 0 42px rgba(114,67,255,.25), inset 0 0 20px rgba(255,255,255,.07);
}
.progress-ring::before { content:"";width:145px;height:145px;border-radius:50%;background:linear-gradient(145deg, #10173c, #071027);box-shadow:inset 0 0 25px rgba(0,0,0,.4); }
:root[data-theme="light"] .progress-ring::before { background:linear-gradient(145deg,#fff,#eef1ff); }
.progress-text { position:absolute;text-align:center; }
.progress-text strong { display:block;font-size:31px;font-weight:950; }
.progress-text span { color:var(--muted);font-size:13px;font-weight:750; }
.announcement { margin-top:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:10px;border-color:rgba(255,189,91,.26); }
.announcement .announce-icon { color:var(--yellow);flex:0 0 auto; }
.announcement-text { font-size:14px;line-height:1.8;flex:1; }
.section { margin-top:18px; }
.section-head { display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px; }
.section-title { display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900; }
.section-title .section-icon { color:var(--primary-2); }
.section-tools { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
.stats-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:12px; }
.stat-card { min-height:134px;padding:18px;box-shadow:none; }
.stat-top { display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:750; }
.stat-icon { width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(132,76,255,.12);color:var(--primary-2); }
.stat-card:nth-child(2) .stat-icon { color:var(--cyan);background:rgba(32,216,255,.10); }

  function bind(){bindToolbar();bindServers();bindChart();bindModal();bindNav();document.getElementById('retry-btn')?.addEventListener('click',fetchInfo);document.getElementById('copy-sub')?.addEventListener('click',()=>copyText(subscriptionUrl()));document.getElementById('qr-sub')?.addEventListener('click',()=>{state.modal={id:'sub',raw:subscriptionUrl(),protocol:'unknown',name:t('copySubscription')};render();});document.getElementById('copy-all')?.addEventListener('click',()=>copyText(parsedLinks().map(x=>x.raw).join('\n'),t('copiedAll')));document.getElementById('support-empty')?.addEventListener('click',()=>toast(t('supportUnavailable'),'error'));}

  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}});
  window.addEventListener('hashchange',()=>setActiveNav(location.hash.slice(1)||'dashboard'));
  render();fetchInfo();fetchUsage();fetchApps();
  if(!isPreview){setInterval(()=>{if(document.visibilityState==='visible')fetchInfo();},CONFIG.refreshIntervalMs);window.addEventListener('focus',fetchInfo);}
})();

  </script>
</body>
